<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-06 · Стена памяти — Save My History</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#08070a;color:#efe7da;font-family:'Georgia',serif;min-height:100vh}
  header{text-align:center;padding:12vh 6vw 6vh}
  header h1{font-size:clamp(30px,6vw,68px);font-weight:400;letter-spacing:.03em;line-height:1.2}
  header h1 .a{color:#c9883f}
  header p{margin-top:20px;color:#9c9486;font-size:clamp(14px,2vw,18px);letter-spacing:.05em}
  .wall{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:1100px;margin:0 auto;padding:0 4vw 8vh}
  @media(min-width:880px){.wall{grid-template-columns:repeat(4,1fr)}}
  .cell{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:4px;cursor:pointer;
    box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cell .af{opacity:0;transition:opacity 1.4s ease;filter:saturate(1.08)}
  .cell.show .af{opacity:1}
  .cell .tag{position:absolute;bottom:0;left:0;right:0;padding:14px;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;background:linear-gradient(transparent,rgba(0,0,0,.8));z-index:2;
    transition:.4s}
  .cell .tag b{color:#c9883f;font-weight:400}
  .foot{text-align:center;padding:0 6vw 14vh}
  .foot .big{font-size:clamp(24px,4.4vw,48px);font-weight:400;line-height:1.35;max-width:18ch;margin:0 auto 40px}
  .cta{display:inline-block;padding:18px 50px;border:1px solid #c9883f;color:#efe7da;text-decoration:none;
    letter-spacing:.18em;text-transform:uppercase;font-size:14px;transition:.4s}
  .cta:hover{background:#c9883f;color:#08070a}
  .accent{color:#c9883f}
</style>
</head>
<body>
  <header>
    <h1>Стена памяти.<br><span class="a">Каждый — кто-то живой.</span></h1>
    <p>Наведи на любого — и время отступит назад.</p>
  </header>

  <div class="wall" id="wall"></div>

  <div class="foot">
    <div class="big">У тебя дома такая же стена. Просто <span class="accent">в коробке</span>.</div>
    <a class="cta" href="#">Восстановить всех</a>
  </div>
<script>
  const base="https://smh-photos.fra1.digitaloceanspaces.com/assets/";
  const items=[
    {k:"g1",t:"Бабушка · 1962"},
    {k:"g2",t:"Свадьба · 1971"},
    {k:"g3",t:"Двор детства"},
    {k:"g4",t:"Отец · молодой"}
  ];
  const wall=document.getElementById('wall');
  items.forEach((it,idx)=>{
    const c=document.createElement('div');c.className='cell';
    c.innerHTML=`<img class="bf" src="${base}${it.k}_before.jpg" alt="">
                 <img class="af" src="${base}${it.k}_after.jpg" alt="">
                 <div class="tag"><b>после</b> · ${it.t}</div>`;
    c.addEventListener('mouseenter',()=>c.classList.add('show'));
    c.addEventListener('mouseleave',()=>c.classList.remove('show'));
    wall.appendChild(c);
    // авто-дыхание по очереди на мобильных
    setInterval(()=>{c.classList.toggle('show')}, 3600+idx*900);
  });
</script>
</body>
</html>
