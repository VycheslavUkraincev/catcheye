<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-14 · Древо рода (интерактив) — Save My History</title>
<style>
  :root{--bg:#0c0a09;--ink:#f1e9dc;--soft:#9a8f7f;--gold:#e0a955;--line:#2a2218}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(130% 100% at 50% 0%,#160f08,#070504);color:var(--ink);
    font-family:Georgia,serif;min-height:100vh;overflow-x:hidden}
  header{text-align:center;padding:8vh 6vw 2vh}
  .eyebrow{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
  h1{font-size:clamp(30px,5.5vw,64px);font-weight:400;line-height:1.05}
  .gold{color:var(--gold)}
  .sub{margin-top:16px;color:var(--soft);font-size:16px}
  /* progress */
  .progress{max-width:520px;margin:24px auto 0}
  .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff3d8);
    transition:width 1s ease}
  .pmeta{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;
    letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
  .rank{color:var(--gold)}
  /* tree field */
  .field{position:relative;width:min(96vw,820px);margin:5vh auto 8vh;aspect-ratio:4/5}
  svg.branches{position:absolute;inset:0;width:100%;height:100%;z-index:1}
  svg.branches path{fill:none;stroke:var(--line);stroke-width:2}
  .node{position:absolute;width:64px;height:80px;transform:translate(-50%,-50%);z-index:2;
    cursor:pointer;border:3px solid var(--line);border-radius:6px;overflow:hidden;
    background:#120d08;display:grid;place-items:center;transition:.4s}
  .node.filled{border-color:var(--gold);box-shadow:0 0 22px rgba(224,169,85,.5)}
  .node img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
  .node.filled img{opacity:1}
  .node .plus{position:absolute;color:var(--soft);font-size:26px;font-weight:300;transition:.3s}
  .node.filled .plus{opacity:0}
  .node:hover{transform:translate(-50%,-50%) scale(1.08);border-color:var(--gold)}
  .node .lbl{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:10px;letter-spacing:.1em;color:var(--soft);text-transform:uppercase}
  /* hint + cta */
  .hint{text-align:center;color:var(--soft);font-size:14px;margin-top:-4vh;padding-bottom:6vh}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);
    background:var(--gold);color:#0c0a09;padding:14px 26px;border-radius:30px;font-size:14px;
    letter-spacing:.05em;opacity:0;transition:.5s;z-index:90}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .cta{display:block;width:max-content;margin:0 auto 12vh;padding:18px 46px;background:var(--gold);
    color:#0c0a09;text-decoration:none;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Древо рода · игровое поле</div>
    <h1>Собери <span class="gold">всех своих.</span></h1>
    <p class="sub">Нажми на пустую ветку — восстанови фото — и предок займёт своё место.</p>
    <div class="progress">
      <div class="bar"><i id="fill"></i></div>
      <div class="pmeta"><span id="cnt">0 / 7 восстановлено</span><span class="rank" id="rank">🥉 Хранитель искры</span></div>
    </div>
  </header>

  <div class="field" id="field">
    <svg class="branches" viewBox="0 0 400 500" preserveAspectRatio="none">
      <path d="M200,470 L200,300"/>
      <path d="M200,320 C150,300 110,260 90,210"/>
      <path d="M200,320 C250,300 290,260 310,210"/>
      <path d="M200,250 C170,220 150,180 140,120"/>
      <path d="M200,250 C230,220 250,180 260,120"/>
      <path d="M90,210 C80,170 80,140 80,100"/>
      <path d="M310,210 C320,170 320,140 320,100"/>
    </svg>
    <!-- nodes positioned in % -->
  </div>

  <div class="hint" id="hint">осталось восстановить: <b id="left">7</b></div>
  <a class="cta" href="#">Восстановить весь род · Family Pass</a>

  <div class="toast" id="toast">+1 предок · +1 кредит ✨</div>

<script>
  const nodes=[
    {x:50,y:62,n:'Ты',k:'hero'},
    {x:22,y:44,n:'Мама',k:'g1'},
    {x:78,y:44,n:'Папа',k:'g2'},
    {x:34,y:24,n:'Бабушка',k:'g3'},
    {x:66,y:24,n:'Дедушка',k:'g4'},
    {x:20,y:20,n:'Прабаба',k:'g1'},
    {x:80,y:20,n:'Прадед',k:'g2'}
  ];
  const base='https://smh-photos.fra1.digitaloceanspaces.com/assets/';
  const field=document.getElementById('field');
  const fill=document.getElementById('fill'),cnt=document.getElementById('cnt'),
        rank=document.getElementById('rank'),left=document.getElementById('left'),
        toast=document.getElementById('toast');
  let done=0;const total=nodes.length;
  function rankFor(d){if(d>=7)return'💎 Хранитель наследия';if(d>=5)return'🥇 Хранитель рода';if(d>=3)return'🥈 Хранитель памяти';return'🥉 Хранитель искры';}
  function update(){
    fill.style.width=(done/total*100)+'%';
    cnt.textContent=done+' / '+total+' восстановлено';
    rank.textContent=rankFor(done);
    left.textContent=total-done;
    if(done===total){document.getElementById('hint').innerHTML='<b class="gold">Род собран. Огонь передан.</b>';}
  }
  nodes.forEach(nd=>{
    const el=document.createElement('div');el.className='node';
    el.style.left=nd.x+'%';el.style.top=nd.y+'%';
    el.innerHTML=`<span class="plus">+</span><img src="${base}${nd.k}_after.jpg" alt=""><span class="lbl">${nd.n}</span>`;
    el.addEventListener('click',()=>{
      if(el.classList.contains('filled'))return;
      el.classList.add('filled');done++;update();
      toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600);
    });
    field.appendChild(el);
  });
  update();
</script>
</body>
</html>
