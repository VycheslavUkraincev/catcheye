<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-12 · Медальон — Save My History</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(120% 100% at 50% 0%,#1a130b,#070504);color:#f3ead9;
    font-family:Georgia,serif;overflow-x:hidden}
  section{min-height:100vh;display:grid;place-items:center;text-align:center;padding:12vh 7vw;position:relative}
  .eyebrow{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:#e6b25c;margin-bottom:20px}
  h1{font-size:clamp(36px,6.5vw,82px);font-weight:400;line-height:1}
  .gold{color:#e6b25c}
  p.lead{margin-top:22px;max-width:44ch;font-size:18px;line-height:1.7;color:#a99a82}
  /* медальон-чаша с веером фото */
  .stagewrap{height:260vh;position:relative}
  .stk{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden}
  .bowl{position:relative;width:min(86vw,520px);height:min(86vw,520px);display:grid;place-items:end center}
  .chalice{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);width:46%;height:34%;
    border:3px solid #e6b25c;border-top:none;border-radius:0 0 50% 50%/0 0 100% 100%;
    box-shadow:0 0 40px rgba(230,178,92,.5),inset 0 -20px 40px rgba(230,178,92,.3)}
  .chalice::before{content:"";position:absolute;top:-6px;left:-8%;width:116%;height:14px;
    background:radial-gradient(closest-side,#e6b25c,transparent);border-radius:50%}
  .fan{position:absolute;bottom:34%;left:50%;width:0;height:0}
  .fan .pic{position:absolute;width:120px;aspect-ratio:4/5;border:5px solid #fff;
    box-shadow:0 16px 40px rgba(0,0,0,.6);transform-origin:bottom center;
    bottom:0;left:-60px;opacity:0;transition:transform 1s ease,opacity 1s ease}
  .fan .pic img{width:100%;height:100%;object-fit:cover}
  .cap{position:absolute;bottom:8vh;left:0;right:0;text-align:center}
  .cap h2{font-size:clamp(22px,4vw,42px);font-weight:400}
  .cta{margin-top:34px;display:inline-block;padding:18px 46px;background:#e6b25c;color:#070504;
    text-decoration:none;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
</style>
</head>
<body>
  <section><div>
    <div class="eyebrow">The Legacy</div>
    <h1>Из одного снимка —<br><span class="gold">целый род.</span></h1>
    <p class="lead">Наведите телефон на старое фото — и прошлое снова обретает цвет и резкость. Прокрутите, чтобы увидеть.</p>
  </div></section>

  <section class="stagewrap" id="sw">
    <div class="stk">
      <div class="bowl">
        <div class="fan" id="fan">
          <div class="pic" data-a="-46"><img src="https://smh-photos.fra1.digitaloceanspaces.com/assets/g1_after.jpg"></div>
          <div class="pic" data-a="-22"><img src="https://smh-photos.fra1.digitaloceanspaces.com/assets/g2_after.jpg"></div>
          <div class="pic" data-a="0"><img src="https://smh-photos.fra1.digitaloceanspaces.com/assets/hero_after.jpg"></div>
          <div class="pic" data-a="22"><img src="https://smh-photos.fra1.digitaloceanspaces.com/assets/g3_after.jpg"></div>
          <div class="pic" data-a="46"><img src="https://smh-photos.fra1.digitaloceanspaces.com/assets/g4_after.jpg"></div>
        </div>
        <div class="chalice"></div>
      </div>
      <div class="cap"><h2 id="cap">Family Pass · 50 снимков</h2></div>
    </div>
  </section>

  <section><div>
    <h1 style="font-size:clamp(28px,5vw,56px)">Подарок, который <span class="gold">невозможно забыть</span>.</h1>
    <a class="cta" href="#">Подарить Family Pass</a>
  </div></section>

<script>
  const sw=document.getElementById('sw');
  const pics=[...document.querySelectorAll('.fan .pic')];
  function onScroll(){
    const r=sw.getBoundingClientRect();
    const total=sw.offsetHeight-innerHeight;
    const p=Math.min(1,Math.max(0,(-r.top)/total));
    pics.forEach((pic,i)=>{
      const a=parseFloat(pic.dataset.a);
      const seg=Math.min(1,Math.max(0,(p-i*0.1)/0.4));
      const rise=160*seg;
      pic.style.opacity=seg;
      pic.style.transform=`translateY(${-rise}px) rotate(${a*seg}deg)`;
    });
  }
  addEventListener('scroll',onScroll);onScroll();
</script>
</body>
</html>
